<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" width="320" height="80">
  <defs>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="40%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Sun Emblem Box -->
  <rect x="4" y="10" width="60" height="60" rx="16" fill="rgba(245, 158, 11, 0.12)" stroke="rgba(245, 158, 11, 0.35)" stroke-width="1.5" />
  
  <!-- Outer Sun Halo -->
  <circle cx="34" cy="40" r="19" fill="#F59E0B" opacity="0.25" filter="url(#glow)" />
  
  <!-- Sun Rays Star Shape -->
  <path d="M 34 22 L 38 29 L 46 25 L 46 34 L 54 36 L 50 44 L 56 49 L 48 53 L 49 61 L 41 59 L 37 66 L 31 61 L 24 64 L 24 56 L 16 54 L 20 46 L 14 41 L 22 37 L 21 29 L 29 31 Z" fill="url(#sunGrad)" />
  
  <!-- Inner Sun Core -->
  <circle cx="34" cy="40" r="13" fill="#FBBF24" />
  <circle cx="34" cy="40" r="10" fill="#F59E0B" />
  <circle cx="32" cy="38" r="4" fill="#FEF08A" opacity="0.6" />

  <!-- Typography: Brand Name -->
  <text x="76" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Outfit', 'Noto Sans Devanagari', 'Segoe UI', sans-serif" font-size="28" font-weight="900" fill="url(#titleGrad)" letter-spacing="-0.5">ऊर्जाSetu</text>

  <!-- Typography: Subtitle -->
  <text x="77" y="60" font-family="-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', sans-serif" font-size="12.5" font-weight="600" fill="#94A3B8" letter-spacing="0.2">Smart Feeder Solarization</text>
</svg>
